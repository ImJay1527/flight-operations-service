# Kubernetes (k8s/), used together with the tls and postgres profiles: --spring.profiles.active=tls,postgres,k8s
#
# The instance name is the pod name (flightops-0, flightops-1, ...), set by Kubernetes in HOSTNAME.
flightops.instance-name=${HOSTNAME}
# No fixed cluster list: the instances find each other through the DNS names of the headless Service flightops-peers,
# so the auto-scaler can add and remove instances while the system runs (cluster.DnsDiscovery, PL3 p.25).
flightops.discovery.url-pattern=${CLUSTER_DISCOVERY:${flightops.scheme}://flightops-{i}.flightops-peers:8083}
flightops.discovery.max-instances=${CLUSTER_MAX_INSTANCES:10}
flightops.discovery.interval-ms=5000
# The database is a second container in the same pod (k8s/flightops.yaml), so: localhost:5432
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flightops}
