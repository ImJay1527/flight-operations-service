# Flight Operations - instance 1.  Start with: --spring.profiles.active=instance1  (or instance1,tls)
server.port=${PORT:8083}
# own database: H2 "flightops_db_1" in memory, or with the postgres profile the PostgreSQL server on port 5433
flightops.db.name=flightops_db_1
flightops.db.port=5433

flightops.peers=${PEERS:${flightops.scheme}://localhost:8093}
flightops.bootstrap.shard=${BOOTSTRAP_SHARD:1}
flightops.bootstrap.shard-count=${SHARD_COUNT:2}

flightops.services.aircraft.urls=${AIRCRAFT_SERVICE_URLS:http://localhost:8081,http://localhost:8091}
flightops.services.airports-routes.urls=${AIRPORTS_ROUTES_SERVICE_URLS:http://localhost:8082,http://localhost:8092}

logging.level.pt.isep.sidis.flightops=DEBUG
