# Flight Operations - instance 1.  Start with: --spring.profiles.active=instance1  (or instance1,tls)
server.port=${PORT:8083}
flightops.instance-name=instance1
# own database: H2 "flightops_db_1" in memory, or with the postgres profile the PostgreSQL server on port 5433
flightops.db.name=flightops_db_1
flightops.db.port=5433

flightops.cluster=${CLUSTER:instance1=${flightops.scheme}://localhost:8083,instance2=${flightops.scheme}://localhost:8093,instance3=${flightops.scheme}://localhost:8103}

flightops.services.aircraft.urls=${AIRCRAFT_SERVICE_URLS:http://localhost:8081,http://localhost:8091,http://localhost:8101}
flightops.services.airports-routes.urls=${AIRPORTS_ROUTES_SERVICE_URLS:http://localhost:8082,http://localhost:8092,http://localhost:8102}

logging.level.pt.isep.sidis.flightops=DEBUG
