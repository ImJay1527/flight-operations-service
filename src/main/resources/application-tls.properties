# Activate with SPRING_PROFILES_ACTIVE=tls (docker-compose does). Certificates: ./scripts/generate-dev-certs.sh
#
# Server side: this replica only serves HTTPS.
server.ssl.bundle=server
spring.ssl.bundle.jks.server.keystore.location=${SSL_KEYSTORE:file:certs/flightops.p12}
spring.ssl.bundle.jks.server.keystore.password=${SSL_PASSWORD:changeit}
spring.ssl.bundle.jks.server.keystore.type=PKCS12
spring.ssl.bundle.jks.server.key.alias=flightops
# TLS 1.3 only (P1 p.16 "TLS 1.3 for network communication"): older clients are refused
spring.ssl.bundle.jks.server.options.enabled-protocols=TLSv1.3

# Client side: calls to peers and to the other services trust only certificates signed by the AISafe CA
# (hostname verification stays on).
spring.ssl.bundle.jks.client.truststore.location=${SSL_TRUSTSTORE:file:certs/truststore.p12}
spring.ssl.bundle.jks.client.truststore.password=${SSL_PASSWORD:changeit}
spring.ssl.bundle.jks.client.truststore.type=PKCS12
spring.ssl.bundle.jks.client.options.enabled-protocols=TLSv1.3
sidis.tls.client-bundle=client

# peer URLs built by the instance profiles use https
flightops.scheme=https
