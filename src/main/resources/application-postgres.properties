# PostgreSQL instead of in-memory H2. Activate together with an instance profile, e.g.
#   --spring.profiles.active=instance1,postgres
# Each instance talks to its OWN PostgreSQL server (container): instance1 -> localhost:5433, instance2 -> :5434,
# instance3 -> :5435 (ports come from the instance profiles). In docker-compose DB_URL points at the container instead.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${flightops.db.port}/flightops}
spring.datasource.username=${DB_USER:flightops}
spring.datasource.password=${DB_PASSWORD:flightops}

# keep the tables and data between restarts (H2 drops everything on shutdown)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
