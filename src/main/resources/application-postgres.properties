# Activate with SPRING_PROFILES_ACTIVE=postgres. Each replica gets its OWN database (its shard).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flightops}
spring.datasource.username=${DB_USER:flightops}
spring.datasource.password=${DB_PASSWORD:flightops}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
