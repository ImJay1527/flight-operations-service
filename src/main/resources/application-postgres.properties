# PostgreSQL instead of in-memory H2, with an instance profile: --spring.profiles.active=instance1,postgres
# Each instance has its own PostgreSQL container (port from the instance profile; in docker-compose DB_URL).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${flightops.db.port}/flightops}
spring.datasource.username=${DB_USER:flightops}
spring.datasource.password=${DB_PASSWORD:flightops}

# keep tables and data between restarts
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
