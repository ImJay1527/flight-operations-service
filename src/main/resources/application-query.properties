# CQRS with separate processes: a QUERY INSTANCE. It answers the queries (every GET) from its own read database and
# takes no commands (405). It is not one of the instances that hold the flights (no shard, no copies): it learns every
# change from the message broker (flight.* events) and repairs its read model from the command instances.
#
#   --spring.profiles.active=cqrs,amqp,query          (plus tls / k8s / stub; "query" LAST, it replaces the database
#                                                      of the postgres and k8s profiles)
# Needs: CLUSTER = the command instances only (or the k8s discovery, which finds them), MONGO_URI or
# flightops.read-db.port (its read database), PORT, INSTANCE_NAME. scripts/run-local.sh --queries 2,
# docker-compose.queries.yml and QUERY_INSTANCES=2 k8s/deploy.sh start some.
flightops.query-only=true
flightops.instance-name=${INSTANCE_NAME:${HOSTNAME:query}}

# No write database. The code still needs one for the login users and the copies of the other services' data
# (aircraft, routes, airports): an in-memory H2 inside the process, never a flight. Nothing to keep across restarts:
# the read model is rebuilt at startup, the copies come back from the events or the REST fallback.
spring.datasource.url=jdbc:h2:mem:flightops_query;NON_KEYWORDS=VALUE;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Its queue on the broker goes one minute after it stops (instead of 7 days): nothing is lost, the read model is rebuilt
# at the next start, and on Kubernetes every new pod has a new name (and so a new queue).
flightops.messaging.queue-expires-ms=60000
