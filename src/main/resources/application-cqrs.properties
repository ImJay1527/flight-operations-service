# CQRS read side: each instance's own read database (MongoDB), next to its PostgreSQL write database.
# Start with e.g. --spring.profiles.active=instance1,postgres,cqrs (docker-compose and run-local.sh do).
flightops.read-model.enabled=true
spring.autoconfigure.exclude=

# One MongoDB per instance (database per instance): the instance profiles set flightops.read-db.port (27018, 27019,
# 27020); docker-compose / Kubernetes set MONGO_URI. Dev credentials; override with READ_DB_PASSWORD.
spring.data.mongodb.uri=${MONGO_URI:mongodb://flightops:${READ_DB_PASSWORD:flightops}@localhost:${flightops.read-db.port}/flightops_read?authSource=admin}
spring.data.mongodb.auto-index-creation=false
# with the read database down, queries fall back to the write side after at most this long (ReadDatabaseConfig)
flightops.read-db.timeout-ms=2000
flightops.read-db.read-timeout-ms=5000
