# Flight Operations - instance 3 (scale-up, see docs/architecture.md).
# Start with: --spring.profiles.active=instance3  (or instance3,tls)
# Instances 1 and 2 must then be started with PEERS listing all others and SHARD_COUNT=3 (scripts/run-local.sh -n 3 does it).
server.port=${PORT:8103}
spring.datasource.url=${DB_URL:jdbc:h2:mem:flightops_db_3;NON_KEYWORDS=VALUE}

flightops.peers=${PEERS:${flightops.scheme}://localhost:8083,${flightops.scheme}://localhost:8093}
flightops.bootstrap.shard=${BOOTSTRAP_SHARD:3}
flightops.bootstrap.shard-count=${SHARD_COUNT:3}

flightops.services.aircraft.urls=${AIRCRAFT_SERVICE_URLS:http://localhost:8081,http://localhost:8091}
flightops.services.airports-routes.urls=${AIRPORTS_ROUTES_SERVICE_URLS:http://localhost:8082,http://localhost:8092}

logging.level.pt.isep.sidis.flightops=DEBUG
