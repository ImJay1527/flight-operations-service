# Flight Operations - instance 3 (scale-up).  Start with: --spring.profiles.active=instance3  (or instance3,tls)
# Instances 1 and 2 then need the same 3-instance list in CLUSTER (scripts/run-local.sh -n 3 does it).
server.port=${PORT:8103}
flightops.instance-name=instance3
# own database: H2 "flightops_db_3" in memory, or with the postgres profile the PostgreSQL server on port 5435
flightops.db.name=flightops_db_3
flightops.db.port=5435

flightops.cluster=${CLUSTER:instance1=${flightops.scheme}://localhost:8083,instance2=${flightops.scheme}://localhost:8093,instance3=${flightops.scheme}://localhost:8103}

flightops.services.aircraft.urls=${AIRCRAFT_SERVICE_URLS:http://localhost:8081,http://localhost:8091}
flightops.services.airports-routes.urls=${AIRPORTS_ROUTES_SERVICE_URLS:http://localhost:8082,http://localhost:8092}

logging.level.pt.isep.sidis.flightops=DEBUG
