# "stub" profile = test mode (Postman collection, PL3 p.16-17):
# - aircraft/route data is built in (stub.StubAircraftDirectory / stub.StubRouteDirectory), the other services are not called
# - an ADMIN may shut this instance down over HTTP: POST /actuator/shutdown. The Postman folder "03 Resilience" stops
#   instance 2 this way; scripts/run-local.sh starts it again a few seconds later. NEVER enabled outside test mode.
management.endpoint.shutdown.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,shutdown
