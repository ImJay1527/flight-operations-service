# Flight Operations - instance 2.  Start with: --spring.profiles.active=instance2  (or instance2,tls)
server.port=${PORT:8093}
spring.datasource.url=${DB_URL:jdbc:h2:mem:flightops_db_2;NON_KEYWORDS=VALUE}

flightops.peers=${PEERS:${flightops.scheme}://localhost:8083}
flightops.bootstrap.shard=${BOOTSTRAP_SHARD:2}
flightops.bootstrap.shard-count=${SHARD_COUNT:2}

# same instances of the other services, opposite order, so the two instances don't hit the same one first
flightops.services.aircraft.urls=${AIRCRAFT_SERVICE_URLS:http://localhost:8091,http://localhost:8081}
flightops.services.airports-routes.urls=${AIRPORTS_ROUTES_SERVICE_URLS:http://localhost:8092,http://localhost:8082}

logging.level.pt.isep.sidis.flightops=DEBUG
