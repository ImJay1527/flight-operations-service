spring.application.name=flight-operations-service
server.port=${PORT:8083}

# ---------- Database ----------
# Each instance has its OWN database. The instance profiles set flightops.db.name / flightops.db.port.
# Default: in-memory H2 (used by the automated tests). With the "postgres" profile: a PostgreSQL server per instance
# (see application-postgres.properties and docker-compose.yml).
flightops.db.name=flightops
flightops.db.port=5432
spring.datasource.url=${DB_URL:jdbc:h2:mem:${flightops.db.name};NON_KEYWORDS=VALUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# ---------- Security ----------
# MUST be the same value in all three services (it signs user tokens and service-to-service tokens).
sidis.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
sidis.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Distribution ----------
# Per-instance values (port, DB name, peers, data slice) live in application-instance<N>.properties.
# Start an instance with --spring.profiles.active=instance1 (add ",tls" for HTTPS). Environment variables still
# override everything (docker-compose uses that for container hostnames).
#
# http or https - used to build the peer URLs in the instance profiles; the "tls" profile switches it to https
flightops.scheme=http
# Other instances of THIS service (comma-separated base URLs, without this instance itself)
flightops.peers=${PEERS:}
flightops.peers-timeout-ms=1500
# Which slice of the 10 sample flights this instance loads: 0 = all (standalone), 1..SHARD_COUNT = one slice each
flightops.bootstrap.shard=${BOOTSTRAP_SHARD:0}
flightops.bootstrap.shard-count=${SHARD_COUNT:2}

# Replicas of the other services (comma-separated base URLs, tried round-robin with failover)
flightops.services.aircraft.urls=${AIRCRAFT_SERVICE_URLS:http://localhost:8081}
flightops.services.airports-routes.urls=${AIRPORTS_ROUTES_SERVICE_URLS:http://localhost:8082}
flightops.services.timeout-ms=2000

# ---------- Resilience (PL3 p.12 and p.14) ----------
# Retry temporary failures of GET requests: up to 3 attempts, waiting 100 ms, then 200 ms (+ random jitter)
sidis.resilience.retry.max-attempts=3
sidis.resilience.retry.initial-backoff-ms=100
sidis.resilience.retry.multiplier=2.0
# Circuit breaker: after 3 failures in a row, skip that instance for 10 s; if the trial request after that fails,
# skip it twice as long (max 60 s). A successful health check closes the circuit again.
sidis.resilience.circuit.failure-threshold=3
sidis.resilience.circuit.open-duration-ms=10000
sidis.resilience.circuit.max-open-duration-ms=60000
# Active health checks: GET /actuator/health on every peer / remote instance
sidis.resilience.health-check-interval-ms=5000
sidis.resilience.health-check-timeout-ms=1000

# ---------- Tracing / logging (PL3 p.15, p.19) ----------
# Name shown in every log line and in the X-Instance response header (the instance profiles set instance1, ...)
flightops.instance-name=standalone
# Console log format of PL3 p.19 (plus the request id): time [thread] LEVEL [instance] [request id] logger - message
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%X{instance:-}] [%X{requestId:-}] %logger{36} - %msg%n
logging.level.org.springframework.web=INFO

# ---------- Ops ----------
# metrics: PL3 p.19 (readable summary: GET /api/cluster/metrics; raw: /actuator/metrics, ADMIN only)
management.endpoints.web.exposure.include=health,info,metrics
springdoc.swagger-ui.path=/swagger-ui.html
