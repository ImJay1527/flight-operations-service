spring.application.name=flight-operations-service
server.port=${PORT:8083}

# ---------- Database ----------
# Each instance has its OWN database. The instance profiles set flightops.db.name / flightops.db.port.
# Default: in-memory H2 (used by the automated tests). With the "postgres" profile: a PostgreSQL server per instance
# (see application-postgres.properties and docker-compose.yml).
flightops.db.name=flightops
flightops.db.port=5432
# LOCK_TIMEOUT: a booking waits up to 10 s for another booking of the same aircraft (H2's default is 1 s)
spring.datasource.url=${DB_URL:jdbc:h2:mem:${flightops.db.name};NON_KEYWORDS=VALUE;LOCK_TIMEOUT=10000}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# ---------- CQRS read side ----------
# Each instance has a second database of its own, for reads (MongoDB): the read model (package readmodel). Off by
# default (tests, run-local.sh --h2): every query then takes the fallback path (the write side, as in Assignment 1).
# The "cqrs" profile switches it on (application-cqrs.properties).
flightops.read-model.enabled=false
# port of this instance's read database (the instance profiles set their own)
flightops.read-db.port=27017
# repair: rebuilt from the write side of all instances every sync-interval, every retry-interval while not READY
flightops.read-model.sync-interval-ms=30000
flightops.read-model.retry-interval-ms=5000
# without the read database Spring must not try to connect to MongoDB
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,  org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# ---------- Messaging (AMQP, RabbitMQ) ----------
# Events between services and instances go through a message broker (Assignment 2). Off by default (tests,
# run-local.sh --h2): no events are published or received, and the read models are kept up to date by the pull above.
# The "amqp" profile switches it on (application-amqp.properties).
flightops.messaging.enabled=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=2s
# a broker that stops answering is noticed within ~2 heartbeats; an AMQP call gives up after rpc-timeout-ms
spring.rabbitmq.requested-heartbeat=10s
flightops.messaging.rpc-timeout-ms=5000
# the system contract (docs/service-contracts.md "Events"): one topic exchange for every service's events, one
# dead-letter exchange; each instance has its own queue (publish/subscribe)
flightops.messaging.exchange=aisafe.events
flightops.messaging.dead-letter-exchange=aisafe.dlx
flightops.messaging.queue=flight.events.${flightops.instance-name}
flightops.messaging.dead-letter-queue=flight.events.dlq
# queue limits: 100 000 messages, each kept 1 day; a queue without consumers for 7 days is removed (an instance
# that is gone); dead letters are kept 7 days
flightops.messaging.queue-max-length=100000
flightops.messaging.message-ttl-ms=86400000
flightops.messaging.queue-expires-ms=604800000
flightops.messaging.dead-letter-ttl-ms=604800000
# outbox: sent right after each commit and retried every relay-interval while the broker is down; an event is
# deleted only once the broker has confirmed it (publisher confirms)
flightops.messaging.relay-interval-ms=1000
flightops.messaging.confirm-timeout-ms=5000
spring.rabbitmq.publisher-confirm-type=simple
# consumer: acknowledged after processing; 3 attempts (0.5 s, 1 s apart), then rejected -> dead-letter queue
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=50
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# copies of the other services' data (aircraft_copy, airport_copy, route_copy), kept up to date by their events: a
# copy that hasn't changed for 1 h is read again from that service's REST API (and used as it is if it is down)
flightops.messaging.copy-max-age-ms=3600000
# the broker is not part of this instance's health: with it down, bookings and queries still work
management.health.rabbit.enabled=false

# ---------- Security ----------
# Encryption at rest (P1 p.16): 256-bit master key, base64. Set DATA_ENCRYPTION_KEY in any real deployment
# (e.g. from a secrets manager); new key: openssl rand -base64 32. Changing it makes stored values unreadable
# unless they are re-encrypted - rotation is planned via the key version in every value (enc:v1:...).
flightops.data-encryption.key=${DATA_ENCRYPTION_KEY:9BvH3kXoOq3m1o9mJmPFjB6m4cO1kz3Hqk2iY7G1M8o=}
# MUST be the same value in all three services (it signs user tokens and service-to-service tokens).
sidis.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
sidis.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- Distribution ----------
# Per-instance values (port, database, cluster list) live in application-instance<N>.properties; start one with
# --spring.profiles.active=instance1 (add ",tls" for HTTPS). Environment variables override everything.
#
# http or https, for the URLs in the instance profiles; the "tls" profile switches it to https
flightops.scheme=http
# ALL instances of this service, the same list everywhere: name=url,name=url (hardcoded peer list, PL3 p.12).
# This instance is the entry named flightops.instance-name; aircraft are sharded over the names (cluster.Cluster).
flightops.cluster=${CLUSTER:}
# Older setting, only used when flightops.cluster is empty: peer URLs, no sharding by aircraft
flightops.peers=${PEERS:}
flightops.peers-timeout-ms=1500
# Replication: each aircraft's flights are kept on this many instances (the owner + backups; 1 = no copies).
# Changes are copied right after they are saved (outbox, retried every retry-interval while an instance is down);
# every sync-interval each instance also fetches whatever it is missing (repair).
flightops.replication.factor=${REPLICATION_FACTOR:2}
flightops.replication.retry-interval-ms=1000
flightops.replication.sync-interval-ms=60000
# Only without a cluster list: which slice of the sample flights to load (0 = all)
flightops.bootstrap.shard=${BOOTSTRAP_SHARD:0}
flightops.bootstrap.shard-count=${SHARD_COUNT:2}

# Instances of the other services (base URLs, tried round-robin with failover)
flightops.services.aircraft.urls=${AIRCRAFT_SERVICE_URLS:http://localhost:8081}
flightops.services.airports-routes.urls=${AIRPORTS_ROUTES_SERVICE_URLS:http://localhost:8082}
flightops.services.timeout-ms=2000

# Web frontends (other origins) allowed to call /api/** from a browser (CORS, PL2 p.9)
sidis.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---------- Resilience (PL3 p.12 and p.14) ----------
# Retry temporary failures of GET requests: up to 3 attempts, waiting 100 ms, then 200 ms (+ random jitter)
sidis.resilience.retry.max-attempts=3
sidis.resilience.retry.initial-backoff-ms=100
sidis.resilience.retry.multiplier=2.0
# Circuit breaker: after 3 failures in a row, skip that instance for 10 s; if the trial request after that fails,
# skip it twice as long (max 60 s). A successful health check closes the circuit again.
sidis.resilience.circuit.failure-threshold=3
sidis.resilience.circuit.open-duration-ms=10000
sidis.resilience.circuit.max-open-duration-ms=60000
# Active health checks: GET /actuator/health on every peer / remote instance
sidis.resilience.health-check-interval-ms=5000
sidis.resilience.health-check-timeout-ms=1000

# ---------- Tracing / logging (PL3 p.15, p.19) ----------
# Shown in every log line and in the X-Instance header (the instance profiles set instance1, ...)
flightops.instance-name=standalone
# Console log format of PL3 p.19 (plus the request id): time [thread] LEVEL [instance] [request id] logger - message
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%X{instance:-}] [%X{requestId:-}] %logger{36} - %msg%n
logging.level.org.springframework.web=INFO

# ---------- Ops ----------
# metrics: summary at GET /api/cluster/metrics; raw values at /actuator/metrics (ADMIN only)
management.endpoints.web.exposure.include=health,info,metrics
# /actuator/health/readiness: UP only once startup has finished (scripts/wait-ready.sh waits for it)
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
