# AMQPS (AMQP over TLS) on port 5671, next to plain AMQP on 5672 (kept for the services that don't use TLS yet).
# Certificates from ./scripts/generate-dev-certs.sh, signed by the AISafe dev CA. The broker proves who it is with its
# certificate; clients still log in with user and password (no client certificates). TLS 1.3 only, as for HTTPS.
# Used by docker-compose.yml (only when certs/rabbitmq.key exists) and by k8s/rabbitmq.yaml.
listeners.ssl.default = 5671
ssl_options.cacertfile = /certs/ca.crt
ssl_options.certfile = /certs/rabbitmq.crt
ssl_options.keyfile = /certs/rabbitmq.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
