# Load balancer in front of the flight-operations instances (P1 p.10 "Load Distribution", p.13, p.18 phase 4).
# Clients use ONE address (https://localhost:8443); nginx spreads the requests over the healthy instances.
events {}

http {
    upstream flightops {
        # "Least connections" (P1 p.13): send each request to the instance with the fewest requests in progress,
        # better than plain round robin when requests take different times (lists vs single lookups).
        least_conn;
        # Passive health check: an instance that fails once is left out for 10 s, then tried again.
        server flightops-1:8083 max_fails=1 fail_timeout=10s;
        server flightops-2:8083 max_fails=1 fail_timeout=10s;
        server flightops-3:8083 max_fails=1 fail_timeout=10s;
    }

    # CQRS with separate processes (docker compose --profile queries): the query instances answer the queries.
    # Without that profile their names don't exist: "resolve" looks them up while running (Docker's DNS) instead of
    # failing at startup, and the command instances (backup) answer, as before. They are also the fallback when no
    # query instance answers.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream flightops_queries {
        zone flightops_queries 64k;
        least_conn;
        server flightops-query-1:8083 resolve max_fails=1 fail_timeout=10s;
        server flightops-query-2:8083 resolve max_fails=1 fail_timeout=10s;
        server flightops-1:8083 backup;
        server flightops-2:8083 backup;
        server flightops-3:8083 backup;
    }

    # Queries (GET / HEAD of /api/**) to the query instances, everything else (commands, login, the dashboard and
    # /api/cluster/**, which describe the command instances) to the command instances. The first match wins.
    map "$request_method $uri" $flightops_side {
        "~^(GET|HEAD) /api/cluster/"  flightops;
        "~^(GET|HEAD) /api/"          flightops_queries;
        default                       flightops;
    }

    log_format lb '$remote_addr "$request" $status -> $upstream_addr ($upstream_status) '
                  '$request_time s id=$http_x_request_id';
    access_log /dev/stdout lb;

    server {
        listen 8443 ssl;
        ssl_certificate     /certs/flightops-lb-chain.crt;
        ssl_certificate_key /certs/flightops-lb.key;
        ssl_protocols       TLSv1.3;

        # to the instances over HTTPS too, verifying their certificate (issued by the AISafe dev CA)
        proxy_ssl_protocols TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /certs/ca.crt;
        proxy_ssl_name flightops;
        proxy_ssl_server_name on;

        # Failover: if an instance can't be reached or doesn't answer, try another one.
        # nginx never repeats a POST/PATCH that an instance may already have received (non-idempotent).
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;

        # $http_host keeps the port (localhost:8443): redirects built by the instances (/dashboard) point back here
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        location / {
            proxy_pass https://$flightops_side;
        }
    }
}
