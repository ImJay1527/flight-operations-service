# Load balancer in front of the flight-operations instances (P1 p.10 "Load Distribution", p.13, p.18 phase 4).
# Clients use ONE address (https://localhost:8443); nginx spreads the requests over the healthy instances.
events {}

http {
    upstream flightops {
        # "Least connections" (P1 p.13): send each request to the instance with the fewest requests in progress,
        # better than plain round robin when requests take different times (lists vs single lookups).
        least_conn;
        # Passive health check: an instance that fails once is left out for 10 s, then tried again.
        server flightops-1:8083 max_fails=1 fail_timeout=10s;
        server flightops-2:8083 max_fails=1 fail_timeout=10s;
    }

    log_format lb '$remote_addr "$request" $status -> $upstream_addr ($upstream_status) '
                  '$request_time s id=$http_x_request_id';
    access_log /dev/stdout lb;

    server {
        listen 8443 ssl;
        ssl_certificate     /certs/flightops-lb-chain.crt;
        ssl_certificate_key /certs/flightops-lb.key;
        ssl_protocols       TLSv1.3;

        location / {
            # to the instances over HTTPS too, verifying their certificate (issued by the AISafe dev CA)
            proxy_pass https://flightops;
            proxy_ssl_protocols TLSv1.3;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /certs/ca.crt;
            proxy_ssl_name flightops;
            proxy_ssl_server_name on;

            # Failover: if an instance can't be reached or doesn't answer, try the other one.
            # nginx never repeats a POST/PATCH that an instance may already have received (non-idempotent).
            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
