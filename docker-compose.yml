# Whole AISafe system: 3 services x 3 instances. Every instance of every service has its own PostgreSQL container
# (database per instance), whose data survives restarts in a named volume.
# Expects the three repos cloned side by side:
#   IdeaProjects/
#     aircraft-maintenance-service/
#     airports-routes-service/
#     flight-operations-service/   <- run `docker compose up --build` here
#
# Clients use the load balancer: https://localhost:8443 (nginx, lb/nginx.conf). The instances stay reachable directly
# on 8083 / 8093 / 8103 for tests that need a specific instance.
# Only flight ops:  docker compose up --build flightops-lb   (starts the 3 instances it needs)
# Only the databases (for running the instances from VS Code / scripts/run-local.sh):
#   docker compose up -d --wait flightops-db-1 flightops-db-2 flightops-db-3
# On Kubernetes, with auto-scaling: k8s/deploy.sh
# Delete all stored data:  docker compose down -v

x-common-env: &common-env
  JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# One PostgreSQL server per flight-ops instance. Dev credentials; override with DB_PASSWORD.
x-flightops-db: &flightops-db
  image: postgres:16-alpine
  environment:
    POSTGRES_DB: flightops
    POSTGRES_USER: flightops
    POSTGRES_PASSWORD: ${DB_PASSWORD:-flightops}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U flightops -d flightops"]
    interval: 2s
    timeout: 3s
    retries: 30

# Flight-ops instances: restarted automatically if they stop on their own (crash, out of memory) - P1 p.10 "Failure
# Recovery" - and checked by Docker every 10 s (state shown in `docker compose ps`).
x-flightops-instance: &flightops-instance
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "curl -fsk https://localhost:8083/actuator/health || curl -fs http://localhost:8083/actuator/health"]
    interval: 10s
    timeout: 3s
    start_period: 60s
    retries: 3

# HTTPS (encryption in transit). Run ./scripts/generate-dev-certs.sh once before `docker compose up`.
x-tls-env: &tls-env
  SPRING_PROFILES_ACTIVE: tls
  SSL_TRUSTSTORE: file:/certs/truststore.p12
  SSL_PASSWORD: ${SSL_PASSWORD:-changeit}

# Aircraft & Maintenance and Airports & Routes (the other two repos): one PostgreSQL server per instance, as in their
# own docker-compose.yml files. DDL_AUTO=update keeps their data across restarts.
x-aircraft-db: &aircraft-db
  image: postgres:16-alpine
  environment:
    POSTGRES_DB: aircraft
    POSTGRES_USER: aircraft
    POSTGRES_PASSWORD: ${DB_PASSWORD:-aircraft}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U aircraft -d aircraft"]
    interval: 2s
    timeout: 3s
    retries: 30

x-aircraft-env: &aircraft-env
  PORT: 8081
  DB_USER: aircraft
  DB_PASSWORD: ${DB_PASSWORD:-aircraft}
  DDL_AUTO: update
  # their "tls" profile (HTTPS, TLS 1.3 only): the same dev CA as flight ops, so each side trusts the other
  SSL_KEYSTORE: file:/certs/aircraft.p12
  SSL_TRUSTSTORE: file:/certs/truststore.p12
  SSL_PASSWORD: ${SSL_PASSWORD:-changeit}

x-aircraft-instance: &aircraft-instance
  build: ../aircraft-maintenance-service
  restart: unless-stopped
  volumes: ["./certs:/certs:ro"]
  healthcheck:
    test: ["CMD-SHELL", "curl -fsk https://localhost:8081/actuator/health"]
    interval: 10s
    timeout: 3s
    start_period: 60s
    retries: 3

x-airports-db: &airports-db
  image: postgres:16-alpine
  environment:
    POSTGRES_DB: airports
    POSTGRES_USER: airports
    POSTGRES_PASSWORD: ${DB_PASSWORD:-airports}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U airports -d airports"]
    interval: 2s
    timeout: 3s
    retries: 30

x-airports-env: &airports-env
  PORT: 8082
  DB_USER: airports
  DB_PASSWORD: ${DB_PASSWORD:-airports}
  DDL_AUTO: update
  # their "tls" profile (HTTPS, TLS 1.3 only): the same dev CA as flight ops, so each side trusts the other
  SSL_KEYSTORE: file:/certs/airports.p12
  SSL_TRUSTSTORE: file:/certs/truststore.p12
  SSL_PASSWORD: ${SSL_PASSWORD:-changeit}

x-airports-instance: &airports-instance
  build: ../airports-routes-service
  restart: unless-stopped
  volumes: ["./certs:/certs:ro"]
  healthcheck:
    test: ["CMD-SHELL", "curl -fsk https://localhost:8082/actuator/health"]
    interval: 10s
    timeout: 3s
    start_period: 60s
    retries: 3

services:
  # ---------------- Flight Operations (this repo) ----------------
  flightops-1:
    <<: *flightops-instance
    build: .
    depends_on:
      flightops-db-1: { condition: service_healthy }
    volumes: ["./certs:/certs:ro"]
    ports: ["8083:8083"]
    environment:
      <<: [*common-env, *tls-env]
      SPRING_PROFILES_ACTIVE: instance1,tls,postgres
      PORT: 8083                       # inside the container; host port above is unique per instance
      DB_URL: jdbc:postgresql://flightops-db-1:5432/flightops
      DB_PASSWORD: ${DB_PASSWORD:-flightops}
      SSL_KEYSTORE: file:/certs/flightops.p12
      CLUSTER: instance1=https://flightops-1:8083,instance2=https://flightops-2:8083,instance3=https://flightops-3:8083   # all instances, same on each
      AIRCRAFT_SERVICE_URLS: https://aircraft-1:8081,https://aircraft-2:8081,https://aircraft-3:8081
      AIRPORTS_ROUTES_SERVICE_URLS: https://airports-1:8082,https://airports-2:8082,https://airports-3:8082

  flightops-2:
    <<: *flightops-instance
    build: .
    depends_on:
      flightops-db-2: { condition: service_healthy }
    volumes: ["./certs:/certs:ro"]
    ports: ["8093:8083"]
    environment:
      <<: [*common-env, *tls-env]
      SPRING_PROFILES_ACTIVE: instance2,tls,postgres
      PORT: 8083                       # inside the container; host port above is unique per instance
      DB_URL: jdbc:postgresql://flightops-db-2:5432/flightops
      DB_PASSWORD: ${DB_PASSWORD:-flightops}
      SSL_KEYSTORE: file:/certs/flightops.p12
      CLUSTER: instance1=https://flightops-1:8083,instance2=https://flightops-2:8083,instance3=https://flightops-3:8083
      AIRCRAFT_SERVICE_URLS: https://aircraft-2:8081,https://aircraft-3:8081,https://aircraft-1:8081
      AIRPORTS_ROUTES_SERVICE_URLS: https://airports-2:8082,https://airports-3:8082,https://airports-1:8082

  flightops-3:
    <<: *flightops-instance
    build: .
    depends_on:
      flightops-db-3: { condition: service_healthy }
    volumes: ["./certs:/certs:ro"]
    ports: ["8103:8083"]
    environment:
      <<: [*common-env, *tls-env]
      SPRING_PROFILES_ACTIVE: instance3,tls,postgres
      PORT: 8083
      DB_URL: jdbc:postgresql://flightops-db-3:5432/flightops
      DB_PASSWORD: ${DB_PASSWORD:-flightops}
      SSL_KEYSTORE: file:/certs/flightops.p12
      CLUSTER: instance1=https://flightops-1:8083,instance2=https://flightops-2:8083,instance3=https://flightops-3:8083
      AIRCRAFT_SERVICE_URLS: https://aircraft-3:8081,https://aircraft-1:8081,https://aircraft-2:8081
      AIRPORTS_ROUTES_SERVICE_URLS: https://airports-3:8082,https://airports-1:8082,https://airports-2:8082

  flightops-lb:
    image: nginx:1.27-alpine
    ports: ["8443:8443"]
    volumes:
      - ./lb/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    depends_on: [flightops-1, flightops-2, flightops-3]
    restart: unless-stopped

  flightops-db-1:
    <<: *flightops-db
    ports: ["5433:5432"]               # host port = the one in application-instance1.properties
    volumes: ["flightops-db-1-data:/var/lib/postgresql/data"]

  flightops-db-2:
    <<: *flightops-db
    ports: ["5434:5432"]
    volumes: ["flightops-db-2-data:/var/lib/postgresql/data"]

  flightops-db-3:
    <<: *flightops-db
    ports: ["5435:5432"]
    volumes: ["flightops-db-3-data:/var/lib/postgresql/data"]

  # Both services serve HTTPS (their "tls" profile, TLS 1.3 only, certs/aircraft.p12 / certs/airports.p12 from the
  # same dev CA as flight ops), also between their own instances.
  # Each instance gets its instance profile and INSTANCE_NAME (their bootstrap data depends on it) and its own
  # PostgreSQL. Their databases have no host port: only their instance uses them.

  # ---------------- Aircraft & Maintenance ----------------
  aircraft-1:
    <<: *aircraft-instance
    depends_on:
      aircraft-db-1: { condition: service_healthy }
    ports: ["8081:8081"]
    environment:
      <<: [*common-env, *aircraft-env]
      SPRING_PROFILES_ACTIVE: instance1,tls,postgres
      INSTANCE_NAME: instance1
      DB_URL: jdbc:postgresql://aircraft-db-1:5432/aircraft
      PEERS: https://aircraft-2:8081,https://aircraft-3:8081

  aircraft-2:
    <<: *aircraft-instance
    depends_on:
      aircraft-db-2: { condition: service_healthy }
    ports: ["8091:8081"]
    environment:
      <<: [*common-env, *aircraft-env]
      SPRING_PROFILES_ACTIVE: instance2,tls,postgres
      INSTANCE_NAME: instance2
      DB_URL: jdbc:postgresql://aircraft-db-2:5432/aircraft
      PEERS: https://aircraft-1:8081,https://aircraft-3:8081

  aircraft-3:
    <<: *aircraft-instance
    depends_on:
      aircraft-db-3: { condition: service_healthy }
    ports: ["8101:8081"]
    environment:
      <<: [*common-env, *aircraft-env]
      SPRING_PROFILES_ACTIVE: instance3,tls,postgres
      INSTANCE_NAME: instance3
      DB_URL: jdbc:postgresql://aircraft-db-3:5432/aircraft
      PEERS: https://aircraft-1:8081,https://aircraft-2:8081

  aircraft-db-1:
    <<: *aircraft-db
    volumes: ["aircraft-db-1-data:/var/lib/postgresql/data"]

  aircraft-db-2:
    <<: *aircraft-db
    volumes: ["aircraft-db-2-data:/var/lib/postgresql/data"]

  aircraft-db-3:
    <<: *aircraft-db
    volumes: ["aircraft-db-3-data:/var/lib/postgresql/data"]

  # ---------------- Airports & Routes ----------------
  airports-1:
    <<: *airports-instance
    depends_on:
      airports-db-1: { condition: service_healthy }
    ports: ["8082:8082"]
    environment:
      <<: [*common-env, *airports-env]
      SPRING_PROFILES_ACTIVE: instance1,tls,postgres
      INSTANCE_NAME: instance1
      DB_URL: jdbc:postgresql://airports-db-1:5432/airports
      PEERS: https://airports-2:8082,https://airports-3:8082

  airports-2:
    <<: *airports-instance
    depends_on:
      airports-db-2: { condition: service_healthy }
    ports: ["8092:8082"]
    environment:
      <<: [*common-env, *airports-env]
      SPRING_PROFILES_ACTIVE: instance2,tls,postgres
      INSTANCE_NAME: instance2
      DB_URL: jdbc:postgresql://airports-db-2:5432/airports
      PEERS: https://airports-1:8082,https://airports-3:8082

  airports-3:
    <<: *airports-instance
    depends_on:
      airports-db-3: { condition: service_healthy }
    ports: ["8102:8082"]
    environment:
      <<: [*common-env, *airports-env]
      SPRING_PROFILES_ACTIVE: instance3,tls,postgres
      INSTANCE_NAME: instance3
      DB_URL: jdbc:postgresql://airports-db-3:5432/airports
      PEERS: https://airports-1:8082,https://airports-2:8082

  airports-db-1:
    <<: *airports-db
    volumes: ["airports-db-1-data:/var/lib/postgresql/data"]

  airports-db-2:
    <<: *airports-db
    volumes: ["airports-db-2-data:/var/lib/postgresql/data"]

  airports-db-3:
    <<: *airports-db
    volumes: ["airports-db-3-data:/var/lib/postgresql/data"]

volumes:
  flightops-db-1-data:
  flightops-db-2-data:
  flightops-db-3-data:
  aircraft-db-1-data:
  aircraft-db-2-data:
  aircraft-db-3-data:
  airports-db-1-data:
  airports-db-2-data:
  airports-db-3-data:
